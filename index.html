<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var theme
        try {
          theme = localStorage.getItem('sims_theme')
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme === 'dark' || theme === 'light' ? theme : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        try {
          document.documentElement.lang = localStorage.getItem('sims_language') === 'sw' ? 'sw' : 'en'
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMS | Student Information Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
